name: Keep Supabase Alive

on:
  schedule:
      - cron: '0 8 * * *'
        workflow_dispatch:

        jobs:
          ping:
              runs-on: ubuntu-latest
                  steps:
                        - name: Ping Supabase
                                run: |
                                          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                                                      -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
                                                                  -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
                                                                              "https://rjscdzpriwhgcukynnto.supabase.co/rest/v1/tt_store?limit=1")
                                                                                        echo "Supabase response: $STATUS"
                                                                                                  if [ "$STATUS" != "200" ]; then
                                                                                                              echo "Warning: Supabase returned $STATUS"
                                                                                                                          exit 1
                                                                                                                                    fi
                                                                                                                                              echo "Supabase is healthy."
